<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script th:replace="~{fragments/theme-head :: earlyInit}"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - Computer Shop Admin</title>
    <link rel="stylesheet" th:href="@{/CSS/admin.css}">
    <link rel="stylesheet" th:href="@{/CSS/admin-product.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">

        <nav class="admin-sidebar" id="adminSidebar">
            <div class="admin-logo">
                <h2><i class="fas fa-laptop"></i> Admin Panel</h2>
            </div>
            <ul class="admin-nav">
                <li><a th:href="@{/admin/dashboard}"><i class="fas fa-chart-bar"></i> <span>Dashboard</span></a></li>
                <li><a th:href="@{/admin/users}"><i class="fas fa-users"></i> <span>Users</span></a></li>
                <li><a th:href="@{/admin/products}" class="active"><i class="fas fa-box"></i> <span>Products</span></a></li>
                <li><a th:href="@{/admin/categories}"><i class="fas fa-tags"></i> <span>Categories</span></a></li>
                <li><a th:href="@{/admin/orders}"><i class="fas fa-shopping-cart"></i> <span>Orders</span></a></li>
                <li><a th:href="@{/admin/report}"><i class="fas fa-file-invoice-dollar"></i> <span>Report</span></a></li>
                <li><a th:href="@{/}"><i class="fas fa-home"></i> <span>Home</span></a></li>
                <li><a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
            </ul>
        </nav>

        <!-- Collapsible Sidebar Toggle -->
        <button class="sidebar-toggle" id="sidebarToggle" title="Collapse/Expand sidebar">
            <i class="fas fa-chevron-left"></i>
        </button>

        <main class="admin-main">
            <!-- Mobile Menu Toggle -->
            <button class="mobile-menu-toggle" id="mobileMenuToggle">
                <i class="fas fa-bars"></i>
            </button>

            <div class="admin-header">
            <th:block th:replace="~{fragments/theme-toggle :: buttonAdmin}"></th:block>
                <h1><i class="fas fa-edit"></i> Edit Product</h1>
                <div class="admin-breadcrumb">
                    <a th:href="@{/admin/products}"><i class="fas fa-arrow-left"></i> Back to product list</a>
                </div>
            </div>

            
            <div th:if="${success}" class="admin-alert admin-alert-success">
                <i class="fas fa-check-circle"></i>
                <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="admin-alert admin-alert-error">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}"></span>
            </div>

            <div class="admin-stats-grid">
                <div class="admin-stat-card">
                    <div class="admin-stat-icon admin-stat-primary">
                        <i class="fas fa-dollar-sign"></i>
                    </div>
                    <div class="admin-stat-content">
                        <h3 th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VND'"></h3>
                        <p>Selling Price</p>
                    </div>
                </div>
                <div class="admin-stat-card">
                    <div class="admin-stat-icon admin-stat-info">
                        <i class="fas fa-warehouse"></i>
                    </div>
                    <div class="admin-stat-content">
                        <h3 th:text="${product.stockQuantity}"></h3>
                        <p>Stock</p>
                    </div>
                </div>
                <div class="admin-stat-card">
                    <div class="admin-stat-icon admin-stat-secondary">
                        <i class="fas fa-tag"></i>
                    </div>
                    <div class="admin-stat-content">
                        <h3 th:text="${product.category?.categoryName ?: 'N/A'}"></h3>
                        <p>Category</p>
                    </div>
                </div>
            </div>

            <div class="admin-form-container">
                <div class="admin-form-header">
                    <h2><i class="fas fa-edit"></i> Product Information</h2>
                    <span class="admin-badge admin-badge-info">ID: <span th:text="${product.productId}"></span></span>
                </div>
                
                <form th:action="@{/admin/products/{id}/update(id=${product.productId})}" 
                      method="post" 
                      th:object="${product}" 
                      class="admin-form">
                    
                    <div class="admin-form-row">
                        <div class="admin-form-group">
                            <label for="productName"><i class="fas fa-box"></i> Product Name *</label>
                            <input type="text" 
                                   id="productName"
                                   th:field="*{productName}" 
                                   placeholder="Enter product name..." 
                                   required>
                        </div>
                        <div class="admin-form-group">
                            <label for="categoryId"><i class="fas fa-tag"></i> Category *</label>
                            <select id="categoryId" name="categoryId" required>
                                <option value="">-- Select Category --</option>
                                <option th:each="category : ${categories}" 
                                        th:value="${category.categoryId}" 
                                        th:selected="${category.categoryId == product.category?.categoryId}"
                                        th:text="${category.categoryName}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="admin-form-row">
                        <div class="admin-form-group">
                            <label for="price"><i class="fas fa-dollar-sign"></i> Price (VND) *</label>
                            <div class="input-with-currency">
                                <input type="text" id="price" th:field="*{price}" 
                                    placeholder="0" required 
                                    oninput="validateForm()">
                            </div>
                            <div id="pricePreview" class="price-preview" style="min-height: 1.2rem; font-size: 0.85rem; margin-top: 4px;"></div>
                        </div>
                        <div class="admin-form-group">
                            <label for="stockQuantity"><i class="fas fa-warehouse"></i> Quantity</label>
                            <input type="text" id="stockQuantity" th:field="*{stockQuantity}" 
                                placeholder="0" oninput="validateForm()">
                            
                            <div id="stockError" style="color: #e74c3c; display: none; font-size: 0.85rem; margin-top: 5px;"></div>
                            
                            <div id="stockStatus" class="stock-status" style="min-height: 1.2rem; font-size: 0.85rem; margin-top: 2px;">
                                <small class="form-help">
                                    Current status: 
                                    <span th:if="${product.stockQuantity > 20}" class="text-success"><i class="fas fa-check-circle"></i> In stock</span>
                                    <span th:if="${product.stockQuantity > 0 && product.stockQuantity <= 20}" class="text-warning"><i class="fas fa-exclamation-triangle"></i> Low stock</span>
                                    <span th:if="${product.stockQuantity <= 0}" class="text-danger"><i class="fas fa-times-circle"></i> Out of stock</span>
                                </small>
                            </div>
                        </div>
                    </div>

                    <div class="admin-form-group">
                        <label for="description"><i class="fas fa-align-left"></i> Description</label>
                        <textarea id="description"
                                 th:field="*{description}" 
                                 placeholder="Enter product description..." 
                                 rows="4"></textarea>
                    </div>

                    
                    <div class="admin-info-section">
                        <h3><i class="fas fa-info-circle"></i> Additional Information</h3>
                        <div class="admin-info-grid">
                            <div class="admin-info-item">
                                <label>Created At:</label>
                                <span th:text="${product.createdAt != null ? #temporals.format(product.createdAt, 'dd/MM/yyyy HH:mm') : 'N/A'}"></span>
                            </div>
                            <div class="admin-info-item">
                                <label>Current Category:</label>
                                <span th:text="${product.category?.categoryName ?: 'Uncategorized'}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="admin-form-actions">
                        <button type="submit" class="admin-btn admin-btn-success">
                            <i class="fas fa-save"></i> Update Product
                        </button>
                        <a th:href="@{/admin/products}" class="admin-btn admin-btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                        
                        
                        <!-- <form th:action="@{/admin/products/{id}/delete(id=${product.productId})}" 
                              method="post" 
                              style="display: inline-block;"
                              onsubmit="return confirm('Are you sure you want to delete this product? This action cannot be undone.')">
                            <button type="submit" class="admin-btn admin-btn-danger">
                                <i class="fas fa-trash"></i> Delete Product
                            </button>
                        </form> -->
                    </div>
                </form>
            </div>

        
        </main>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        // Thêm ID cho nút submit để JS dễ điều khiển
        const btn = document.querySelector('button[type="submit"].admin-btn-success');
        if(btn) btn.id = "submitBtn";

        // Khởi tạo kiểm tra form khi vừa load trang
        validateForm();

        // 1. CHẶN NHẬP KÝ TỰ LẠ (Chỉ mang tính chất hỗ trợ phím bấm)
        const numberInputs = ['price', 'stockQuantity'];
        numberInputs.forEach(id => {
            const input = document.getElementById(id);
            if (input) {
                input.addEventListener('keydown', function(e) {
                    if (['e', 'E', '+', '-'].includes(e.key)) {
                        e.preventDefault();
                    }
                });
            }
        });

        // 2. TỰ ĐỘNG GÁN STOCK = 0 NẾU ĐỂ TRỐNG KHI SUBMIT
        const editForm = document.querySelector('form'); // Form edit
        if (editForm) {
            editForm.addEventListener('submit', function(e) {
                const stockInput = document.getElementById('stockQuantity');
                if (stockInput && stockInput.value.trim() === "") {
                    stockInput.value = "0";
                }
                const submitBtn = document.getElementById('submitBtn');
                if(submitBtn) submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
            });
        }

        // 3. TỰ ĐỘNG ẨN THÔNG BÁO FLASH
        setTimeout(function() {
            const alerts = document.querySelectorAll('.admin-alert');
            alerts.forEach(alert => {
                alert.style.opacity = '0';
                setTimeout(() => alert.remove(), 300);
            });
        }, 5000);
    });

    function validateForm() {
        const submitBtn = document.getElementById('submitBtn');
        const priceInput = document.getElementById('price');
        const stockInput = document.getElementById('stockQuantity');
        
        const pricePreview = document.getElementById('pricePreview');
        const stockStatus = document.getElementById('stockStatus');
        const stockError = document.getElementById('stockError');
        
        // Lấy giá trị thô từ input
        let priceValue = priceInput.value.trim();
        let stockValue = stockInput.value.trim();
        
        let isPriceValid = false;
        let isStockValid = false;
        
        // Hàm kiểm tra số: Chấp nhận cả số nguyên và số thập phân (để khớp dữ liệu DB)
        const isNumeric = (val) => val !== "" && !isNaN(val) && !/\s/.test(val);

        // --- KIỂM TRA Ô GIÁ ---
        if (priceValue === "") {
            pricePreview.textContent = ""; 
            priceInput.style.borderColor = ""; 
            isPriceValid = false; 
        } else if (!isNumeric(priceValue)) {
            // Nếu chứa chữ hoặc ký tự đặc biệt thực sự
            pricePreview.textContent = "Value must be a number!";
            pricePreview.style.color = "#e74c3c";
            priceInput.style.borderColor = "#e74c3c";
            isPriceValid = false;
        } else {
            // Nếu là số hợp lệ (bao gồm cả 20000.00)
            const priceNum = parseFloat(priceValue);
            if (priceNum < 1000) {
                pricePreview.textContent = "Minimum price is 1,000 VND";
                pricePreview.style.color = "#e74c3c";
                priceInput.style.borderColor = "#e74c3c";
                isPriceValid = false;
            } else {
                // HIỂN THỊ PREVIEW XANH NGAY KHI MỚI VÀO
                pricePreview.textContent = "Preview: " + formatCurrency(priceNum) + " VND";
                pricePreview.style.color = "#2ecc71";
                priceInput.style.borderColor = ""; 
                isPriceValid = true;
            }
        }

        // --- KIỂM TRA Ô SỐ LƯỢNG ---
        if (stockValue === "") {
            if (stockError) stockError.style.display = 'none';
            stockStatus.style.display = 'block';
            stockStatus.innerHTML = '<span style="color:#e67e22">Status: Out of stock (Default 0)</span>';
            stockInput.style.borderColor = ''; 
            isStockValid = true; 
        } else if (!isNumeric(stockValue)) {
            if (stockError) {
                stockError.textContent = 'Value must be a number!';
                stockError.style.display = 'block';
            }
            stockStatus.style.display = 'none';
            stockInput.style.borderColor = '#e74c3c';
            isStockValid = false;
        } else {
            if (stockError) stockError.style.display = 'none';
            stockStatus.style.display = 'block';
            updateStockStatusUI(stockValue);
            stockInput.style.borderColor = '';
            isStockValid = true;
        }

        // --- KIỂM TRA CÁC TRƯỜNG KHÁC ---
        const productName = document.getElementById('productName').value.trim();
        const categoryId = document.getElementById('categoryId').value;
        const isOtherValid = productName.length >= 4 && categoryId !== "";

        // --- CẬP NHẬT NÚT SUBMIT ---
        const finalValid = isPriceValid && isStockValid && isOtherValid;
        if (submitBtn) {
            submitBtn.disabled = !finalValid;
            submitBtn.style.opacity = finalValid ? "1" : "0.5";
            submitBtn.style.cursor = finalValid ? "pointer" : "not-allowed";
        }
    }

    function updateStockStatusUI(value) {
        const statusElement = document.getElementById('stockStatus');
        const stock = parseInt(value);
        if (stock <= 0) {
            statusElement.innerHTML = '<span style="color:#e67e22">Status: Out of stock</span>';
        } else if (stock <= 5) {
            statusElement.innerHTML = '<span style="color:#f1c40f">Status: Low stock</span>';
        } else {
            statusElement.innerHTML = '<span style="color:#2ecc71">Status: In stock</span>';
        }
    }

    function formatCurrency(amount) {
        return new Intl.NumberFormat('vi-VN').format(amount);
    }
</script>
    <script th:src="@{/JavaScript/admin-sidebar.js}"></script>
    <th:block th:replace="~{fragments/admin-scripts :: themeScript}"></th:block>

</body>
</html>
