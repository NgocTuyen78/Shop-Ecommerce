<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <script th:replace="~{fragments/theme-head :: earlyInit}"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>
    <link rel="stylesheet" th:href="@{/CSS/style.css}" />
    <link rel="stylesheet" th:href="@{/CSS/header.css}" />
    <link rel="stylesheet" th:href="@{/CSS/footer.css}" />
    <link rel="stylesheet" th:href="@{/CSS/cart.css}" />
  </head>
  <body>
    <div th:replace="~{header :: header}"></div>

    <div class="container cart-page">
      <h1>Your Shopping Cart</h1>

      <div th:if="${#lists.isEmpty(cartItems)}" class="empty-cart">
        <p>Your cart is empty.</p>
        <a class="btn" th:href="@{/}">Continue Shopping</a>
      </div>

      <div th:if="${!#lists.isEmpty(cartItems)}">
        <table class="cart-table">
          <thead>
            <tr>
              <!-- Checkbox chọn tất cả -->
              <th>
                <input type="checkbox" id="select-all"/>
              </th>
              <th>Product</th>
              <th>Unit Price</th>
              <th>Quantity</th>
              <th>Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="item : ${cartItems}">
              <!-- Checkbox từng sản phẩm -->
              <td>
                <input type="checkbox" class="cart-item-checkbox" 
                      th:attr="data-cart-item-id=${item.cartItemId}"/>
              </td>
              <td class="product-col">
                <img
                  th:src="${item.product.image != null ? item.product.image.imageUrl : '/Images/placeholder.svg'}"
                  alt="img"
                  class="thumb"
                  onerror="this.src = '/Images/placeholder.svg'"
                />
                <div class="product-info">
                  <div class="name" th:text="${item.product.productName}"></div>
                </div>
              </td>
              <td
                th:text="${#numbers.formatDecimal(item.product.price,1,'COMMA',0,'POINT')} + ' ₫'"
              ></td>
              <td>
                <input
                    type="number"
                    min="1"
                    th:value="${item.quantity}"
                    class="qty-input"
                    th:attr="data-cart-item-id=${item.cartItemId}, data-max-stock=${item.product.stockQuantity}"
                />
            </td>
              <td
                th:text="${#numbers.formatDecimal(item.subtotal,1,'COMMA',0,'POINT')} + ' ₫'"
              ></td>
              <td>
                <button
                  class="btn danger remove-btn"
                  th:attr="data-cart-item-id=${item.cartItemId}"
                >
                  Remove
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <div class="cart-summary">
          <div class="summary-row">
            <span>Total:</span>
            <span class="total" style="font-weight: bold; color: #28a745; font-size: 1.2rem;">
                (Total Items: 0) 0 ₫
            </span>
          </div>
          <div class="actions">
            <a class="btn" th:href="@{/}">Continue Shopping</a>
            <a class="btn primary" th:href="@{/cart/checkout}">Checkout</a>
            <form
              th:action="@{/cart/clear}"
              method="post"
              style="display: inline"
            >
              <button class="btn" type="submit">Clear Cart</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{footer :: footer}"></div>

    <script th:src="@{/JavaScript/header.js}"></script>
    <script th:src="@{/JavaScript/main.js}"></script>
    <script>

      // Chọn sản phẩm để thanh toán
      document.addEventListener("DOMContentLoaded", function () {
    const selectAll = document.getElementById("select-all");
    const itemCheckboxes = document.querySelectorAll(".cart-item-checkbox");
    const checkoutBtn = document.querySelector('.btn.primary');
    document.querySelectorAll(".qty-input").forEach(input => {
        // Lưu giá trị cũ để so sánh, tránh load trang nếu số không đổi
        let oldVal = input.value;

        input.addEventListener("blur", function () {
            handleUpdate(this);
        });

        input.addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                this.blur(); // Tự động kích hoạt blur khi nhấn Enter
            }
        });

        function handleUpdate(el) {
        const id = el.getAttribute("data-cart-item-id");
        const maxStock = parseInt(el.getAttribute("data-max-stock") || "999");
        
        // Lấy giá trị thô từ input
        let rawValue = el.value;

        // KIỂM TRA CHỮ VÀ SỐ TRỐNG (Cực kỳ quan trọng)
        // Nếu là chữ hoặc trống, ép về 1 ngay lập tức và dừng xử lý tiếp
        if (rawValue === "" || isNaN(rawValue)) {
            el.value = 1;
            window.showToast("Please enter a valid number!", "error");
            return; 
        }

        let qty = parseInt(rawValue);

        // KIỂM TRA KHOẢNG GIÁ TRỊ (1 -> max)
        if (qty < 1) {
            qty = 1;
            el.value = 1;
            window.showToast("Minimum quantity is 1!", "error");
        } else if (qty > maxStock) {
            qty = maxStock;
            el.value = maxStock;
            window.showToast(`Only ${maxStock} units available!`, "error");
        }

        if (qty.toString() !== oldVal) {
            fetch("/cart/update", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ cartItemId: id, quantity: qty }),
            }).then(response => {
                if (response.ok) {
                    window.showToast("Quantity updated!", "success");
                    setTimeout(() => {
                        location.reload();
                    }, 800);
                } else {
                    // Nếu server báo lỗi (ví dụ hết hàng thật sự ở DB)
                    window.showToast("Update failed!", "error");
                    el.value = oldVal; 
                }
            }).catch(() => {
                window.showToast("Server error!", "error");
                el.value = oldVal;
            });
          }
        }
    });

    // Xử lý sự kiện Thay đổi (Chọn checkbox)
    document.addEventListener("change", function (e) {
        if (e.target.id === "select-all") {
            itemCheckboxes.forEach(cb => cb.checked = e.target.checked);
            updateSelectedCount();
        }

        if (e.target.matches(".cart-item-checkbox")) {
            selectAll.checked = Array.from(itemCheckboxes).every(cb => cb.checked);
            updateSelectedCount();
        }
    });

    // Hàm tính lại tổng tiền dựa trên những mục được tích
    function updateSelectedCount() {
        // Lấy tất cả các checkbox đang được tích
        const selectedCheckboxes = document.querySelectorAll(".cart-item-checkbox:checked");
        
        let totalItemsCount = 0; 
        let selectedTotal = 0;  

        // Duyệt qua từng dòng được chọn
        selectedCheckboxes.forEach(cb => {
            const row = cb.closest("tr");

            // --- LẤY SỐ LƯỢNG (Cột 4) ---
            // Lấy text ở cột Quantity, loại bỏ ký tự không phải số và cộng dồn
            const qtyInput = row.querySelector("td:nth-child(4) .qty-input");
            const qty = parseInt(qtyInput.value) || 0; 
            totalItemsCount += qty;

            // --- LẤY THÀNH TIỀN (Cột 5) ---
            const amountText = row.querySelector("td:nth-child(5)").textContent;
            const amount = parseInt(amountText.replace(/\D/g, "")) || 0;
            selectedTotal += amount;
        });

        const formattedTotal = selectedTotal.toLocaleString('vi-VN');

        const totalDisplay = document.querySelector(".cart-summary .total");
        if (totalDisplay) {
            totalDisplay.textContent = `(Total Items: ${totalItemsCount}) ${formattedTotal} ₫`;
        }
    }

    //Xử lý nút Checkout (Chỉ thanh toán thứ đã chọn)
    if (checkoutBtn) {
        checkoutBtn.addEventListener('click', function (e) {
            e.preventDefault(); 

            const selectedCheckboxes = document.querySelectorAll(".cart-item-checkbox:checked");
            const selectedIds = Array.from(selectedCheckboxes)
                                    .map(cb => cb.getAttribute("data-cart-item-id"));

            if (selectedIds.length === 0) {
                window.showToast("Please select at least one product to checkout!", "error");
            } else {
                const checkoutUrl = "/cart/checkout?ids=" + selectedIds.join(",");
                window.location.href = checkoutUrl;
            }
        });
    }

    // 4. AJAX cho nút Update/Remove
    document.addEventListener("click", function (e) {
        if (e.target.matches(".update-btn")) {
            const id = e.target.getAttribute("data-cart-item-id");
            const input = document.querySelector('.qty-input[data-cart-item-id="' + id + '"]');
            const qty = parseInt(input.value || "0");
            fetch("/cart/update", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ cartItemId: id, quantity: qty }),
            }).then(() => location.reload());
        }

        if (e.target.matches(".remove-btn")) {
            const id = e.target.getAttribute("data-cart-item-id");
            fetch("/cart/remove", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ cartItemId: id }),
            }).then(() => location.reload());
        }
    });
});
    </script>
  </body>
</html>
